    <h1 style="text-align: left;"><br>Oli.Bouge - Motion Designer<br></h1>
<!-- Tab links -->
<div class="tab">
  <button class="tablinks" onclick="openCity(event, 'Projets')">Projets</button>
  <button class="tablinks" onclick="openCity(event, 'Infos')">Infos</button>
  <button class="tablinks" onclick="openCity(event, 'Instagram')">Instagram</button>
</div>
<!-- Tab content -->
<div id="Projets" class="tabcontent">
  <h3>Projets</h3>
  <p>À venir </p>
</div>

<div id="Infos" class="tabcontent">
  <h3>Infos</h3>
  <<a href="mailto:bonjour@olibouge.com">bonjour@olibouge.com</a>
</div>

<div id="Instagram" class="https://www.instagram.com/oli.bouge/" target="_blank" rel="noopener">
  <!-- <a href="https://www.instagram.com/oli.bouge/" target="_blank" rel="noopener">instagram</a> -->
</div>
    
<!-- JavaScript -->
<script>
function openCity(evt, cityName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  document.getElementById(cityName).style.display = "block";
  evt.currentTarget.className += " active";
}
</script>
